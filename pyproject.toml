[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "litegram"
description = 'Modern and fully asynchronous framework for Telegram Bot API'
readme = "README.rst"
requires-python = ">=3.13,<3.16"
license = "MIT"
authors = [
    { name = "Ruslan Samoylov", email = "ruslan@samoylov.tech" },
]
maintainers = [
    { name = "Ruslan Samoylov", email = "ruslan@samoylov.tech" },
]
keywords = [
    "telegram",
    "bot",
    "api",
    "framework",
    "wrapper",
    "asyncio",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "litestar>=2.25.0,<3.0",
    "pydantic>=2.14.4,<3.0",
    "aiofiles>=25.1.0,<26.0",
    "certifi>=2026.11.20",
    "typing-extensions>=4.16.0,<5.0",
]
dynamic = ["version"]

[tool.hatch.version]
path = "litegram/__meta__.py"

[project.optional-dependencies]
fast = [
    "uvloop>=0.23.0,<0.24; (sys_platform == 'darwin' or sys_platform == 'linux') and platform_python_implementation != 'PyPy'",
    "httptools>=0.9.0,<0.10",
]
speedups = [
    "litegram[fast]",
]
redis = [
    "redis[hiredis]>=8.1.0,<9.0",
]
mongo = [
    "motor>=3.7.1,<3.8",
    "pymongo>=4.20.1,<5.0",
]
proxy = [
    "httpx[socks]>=0.28.1,<0.29",
]
i18n = [
    "Babel>=2.18.0,<3",
]
cli = [
    "uvicorn[standard]>=0.54.0,<0.55",
    "rich-click>=1.9.9,<2.0",
]
cryptography = [
    "cryptography>=50.0.2,<51.0",
]
signature = [
    "litegram[cryptography]",
]
docs = [
    "Sphinx>=9.2.0,<10",
    "sphinx-intl>=2.4.0,<3",
    "sphinx-autobuild>=2025.8.25,<2026",
    "sphinx-copybutton>=0.5.2,<0.6",
    "furo>=2025.12.19,<2026",
    "Sphinx-Substitution-Extensions>=2026.10.9,<2027",
    "towncrier>=26.9.0,<27",
    "pygments>=2.21.0,<3",
    "pymdown-extensions>=13.1.2,<14",
    "markdown-include>=0.8.1,<0.9",
    "sphinxcontrib-towncrier>=0.5.0a0,<0.6",
]

[dependency-groups]
dev = [
    "pyyaml>=6.0.4,<7",
    "ruff>=0.17.6,<0.18",
    "pre-commit>=4.7.0,<5",
    "packaging>=26.3,<27",
    "motor-types>=1.0.0b4,<2",
    "ty==0.0.107",
    "watchfiles>=1.3.0,<1.4",
]
test = [
    "pytest==9.2.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.17.0",
    "pytest-cov==7.1.0",
    "pytest-httpx==0.36.2",
    "pytest-asyncio==1.5.0",
    "polyfactory==3.5.0",
    "pytz==2026.6",
    "pycryptodomex==3.24.2",
]

[project.urls]
Homepage = "https://litegram.dev/"
Documentation = "https://litegram.readthedocs.io/"
Repository = "https://github.com/litegram/litegram/"

[project.scripts]
litegram = "litegram.cli.main:litegram_group"

[tool.ruff]
line-length = 128
target-version = "py313"
src = ["litegram", "tests"]
exclude = [
    ".git",
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "dev",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    # "C", # TODO: mccabe - code complecity
    "A", # flake8-annotations
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "PERF", # perflint
    "PL", # pylint
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP", # pyupgrade
    "TC", # flake8-type-checking
    "FURB", # refurb
]
ignore = [
    "F401", # unused-import (handled by other tools)
    "A002", # builtin-argument-shadowing (common in API: type, id, format, etc.)
    "A005", # stdlib-module-shadowing (Module `types` shadows a Python standard-library module)
    "B008", # function-call-in-default-argument (Pydantic Field() defaults)
    "UP042", # BotCommandScopeType inherits from both `str` and `enum.Enum` (intentional)
    "B024", # KeyboardBuilder is an abstract base class, but it has no abstract methods or properties
    "PLC0415", # import-outside-top-level (needed for circular imports)
    "PLC1901", # compare-to-empty-string (sometimes more explicit is better)
    "PLR0904", # too-many-public-methods (Bot class has many API methods)
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments (Telegram API methods have many params)
    "PLR0915", # too-many-statements
    "PLR0917", # too-many-positional-arguments (Telegram API design)
    "PLR6301", # no-self-use (sometimes methods are intentionally not static)
    "PLW2901", # redefined-loop-name (intentional pattern in this codebase)
    "PLW3201", # bad-dunder-method-name (custom dunders for framework design)
]

[tool.ruff.lint.isort]
known-first-party = [
    "litegram",
    "finite_state_machine",
    "handlers",
    "routes",
]

[tool.ruff.lint.per-file-ignores]
"litegram/types/*" = ["E501"]
"litegram/types/rich_text_union.py" = ["TC008", "UP035", "UP040"]
"litegram/utils/magic_filter/attrdict.py" = ["FURB189"]
"litegram/methods/*" = ["E501", "TC001"]
"litegram/client/bot.py" = ["E501"]
"scripts/api_tool/*" = ["T201"]  # CLI output
"scripts/verify_live.py" = ["T201"]  # CLI output
"litegram/enums/*" = ["E501"]
"tests/test_filters/test_chat_member_updated.py" = ["PLC2701"]  # private helpers under explicit test
"tests/test_filters/test_logic.py" = ["PLC2701"]  # private composition types under explicit test
"tests/**" = ["PLR2004"]


[tool.pytest.ini_options]
markers = [
    "asyncio: mark test as asyncio",
    "anyio: mark test as anyio",
    "redis: marked tests require redis connection to run",
    "mongo: marked tests require mongo connection to run",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = [
    "tests",
]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Remove when uvloop fixes the issue
    # https://github.com/MagicStack/uvloop/issues/703
    # https://github.com/MagicStack/uvloop/pull/705
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.*:UserWarning",
]

[tool.coverage.run]
branch = false
parallel = true
omit = [
    "litegram/__meta__.py",
    "litegram/dispatcher/middlewares/data.py"
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "if sys.version_info",
    "except ImportError:"
]

[tool.ty]
environment.python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "ignore"
unknown-argument = "ignore"
possibly-missing-attribute = "ignore"
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-parameter-default = "ignore"
incompatible-method-override = "ignore"
# Filter call signatures and generated Pydantic discriminator fields intentionally narrow their base declarations.
incompatible-mutable-override = "ignore"
invalid-explicit-return = "ignore"
invalid-assignment = "ignore"
redundant-cast = "ignore"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.towncrier]
package = "litegram"
filename = "CHANGES.rst"
directory = "CHANGES/"
template = "CHANGES/.template.rst.jinja2"
issue_format = "`#{issue} <https://github.com/litegram/litegram/issues/{issue}>`_"
ignore = [
    ".template.rst.jinja2",
]

[[tool.towncrier.section]]
path = ""

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true
