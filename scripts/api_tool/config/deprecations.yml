UsersShared:
  request_id:
    version: '7.2'
    url: https://core.telegram.org/bots/api-changelog#march-31-2024
    annotation: "int\n    \"\"\"Identifier of the request\"\"\"\n    users: list[SharedUser]\n\
      \    \"\"\"Information about users shared with the bot.\"\"\"\n    user_ids:\
      \ list[int] | None"
    docstring: Identifiers of the shared users. These numbers may have more than 32
      significant bits and some programming languages may have difficulty/silent defects
      in interpreting them. But they have at most 52 significant bits, so 64-bit integers
      or double-precision float types are safe for storing these identifiers. The
      bot may not have access to the users and could be unable to use these identifiers,
      unless the users are already known to the bot by some other means.
