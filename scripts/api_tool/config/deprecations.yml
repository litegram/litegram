BusinessBotRights:
  can_delete_outgoing_messages:
    version: '9.1'
    url: https://core.telegram.org/bots/api-changelog#july-3-2025
    annotation: bool | None
    docstring: '*Optional*. True, if the bot can delete messages sent by the bot'
BusinessConnection:
  can_reply:
    version: '9.0'
    url: https://core.telegram.org/bots/api-changelog#april-11-2025
    annotation: bool | None
    docstring: True, if the bot can act on behalf of the business account in chats
      that were active in the last 24 hours
Chat:
  accent_color_id:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: int | None
    docstring: '*Optional*. Identifier of the accent color for the chat name and backgrounds
      of the chat photo, reply header, and link preview. See `accent colors <https://core.telegram.org/bots/api#accent-colors>`_
      for more details. Returned only in :class:`litegram.methods.get_chat.GetChat`.
      Always returned in :class:`litegram.methods.get_chat.GetChat`.'
  active_usernames:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: list[str] | None
    docstring: '*Optional*. If non-empty, the list of all `active chat usernames <https://telegram.org/blog/topics-in-groups-collectible-usernames#collectible-usernames>`_;
      for private chats, supergroups and channels. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  available_reactions:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: list[ReactionTypeUnion] | None
    docstring: '*Optional*. List of available reactions allowed in the chat. If omitted,
      then all `emoji reactions <https://core.telegram.org/bots/api#reactiontypeemoji>`_
      are allowed. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  background_custom_emoji_id:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. Custom emoji identifier of emoji chosen by the chat for
      the reply header and link preview background. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  bio:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. Bio of the other party in a private chat. Returned only
      in :class:`litegram.methods.get_chat.GetChat`.'
  birthdate:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: Birthdate | None
    docstring: '*Optional*. For private chats, the date of birth of the user. Returned
      only in :class:`litegram.methods.get_chat.GetChat`.'
  business_intro:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: BusinessIntro | None
    docstring: '*Optional*. For private chats with business accounts, the intro of
      the business. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  business_location:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: BusinessLocation | None
    docstring: '*Optional*. For private chats with business accounts, the location
      of the business. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  business_opening_hours:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: BusinessOpeningHours | None
    docstring: '*Optional*. For private chats with business accounts, the opening
      hours of the business. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  can_set_sticker_set:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if the bot can change the group sticker
      set. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  custom_emoji_sticker_set_name:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. For supergroups, the name of the group''s custom emoji
      sticker set. Custom emoji from this set can be used by all users and bots in
      the group. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  description:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. Description, for groups, supergroups and channel chats.
      Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  emoji_status_custom_emoji_id:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. Custom emoji identifier of the emoji status of the chat
      or the other party in a private chat. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  emoji_status_expiration_date:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: DateTime | None
    docstring: '*Optional*. Expiration date of the emoji status of the chat or the
      other party in a private chat, in Unix time, if any. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  has_aggressive_anti_spam_enabled:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if aggressive anti-spam checks are enabled
      in the supergroup. The field is only available to chat administrators. Returned
      only in :class:`litegram.methods.get_chat.GetChat`.'
  has_hidden_members:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if non-administrators can only get the list
      of bots and administrators in the chat. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  has_private_forwards:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if privacy settings of the other party in
      the private chat allows to use :code:`tg://user?id=<user_id>` links only in
      chats with the user. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  has_protected_content:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if messages from the chat can''t be forwarded
      to other chats. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  has_restricted_voice_and_video_messages:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if the privacy settings of the other party
      restrict sending voice and video note messages in the private chat. Returned
      only in :class:`litegram.methods.get_chat.GetChat`.'
  has_visible_history:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if new chat members will have access to
      old messages; available only to chat administrators. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  invite_link:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. Primary invite link, for groups, supergroups and channel
      chats. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  join_by_request:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if all users directly joining the supergroup
      need to be approved by supergroup administrators. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  join_to_send_messages:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: bool | None
    docstring: '*Optional*. :code:`True`, if users need to join the supergroup before
      they can send messages. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  linked_chat_id:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: int | None
    docstring: '*Optional*. Unique identifier for the linked chat, i.e. the discussion
      group identifier for a channel and vice versa; for supergroups and channel chats.
      This identifier may be greater than 32 bits and some programming languages may
      have difficulty/silent defects in interpreting it. But it is smaller than 52
      bits, so a signed 64 bit integer or double-precision float type are safe for
      storing this identifier. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  location:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: ChatLocation | None
    docstring: '*Optional*. For supergroups, the location to which the supergroup
      is connected. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  message_auto_delete_time:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: int | None
    docstring: '*Optional*. The time after which all messages sent to the chat will
      be automatically deleted; in seconds. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  permissions:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: ChatPermissions | None
    docstring: '*Optional*. Default chat member permissions, for groups and supergroups.
      Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  personal_chat:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: Chat | None
    docstring: '*Optional*. For private chats, the personal channel of the user. Returned
      only in :class:`litegram.methods.get_chat.GetChat`.'
  photo:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: ChatPhoto | None
    docstring: '*Optional*. Chat photo. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  pinned_message:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: Message | None
    docstring: '*Optional*. The most recent pinned message (by sending date). Returned
      only in :class:`litegram.methods.get_chat.GetChat`.'
  profile_accent_color_id:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: int | None
    docstring: '*Optional*. Identifier of the accent color for the chat''s profile
      background. See `profile accent colors <https://core.telegram.org/bots/api#profile-accent-colors>`_
      for more details. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  profile_background_custom_emoji_id:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. Custom emoji identifier of the emoji chosen by the chat
      for its profile background. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  slow_mode_delay:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: int | None
    docstring: '*Optional*. For supergroups, the minimum allowed delay between consecutive
      messages sent by each unprivileged user; in seconds. Returned only in :class:`litegram.methods.get_chat.GetChat`.'
  sticker_set_name:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: str | None
    docstring: '*Optional*. For supergroups, name of group sticker set. Returned only
      in :class:`litegram.methods.get_chat.GetChat`.'
  unrestrict_boost_count:
    version: '7.3'
    url: https://core.telegram.org/bots/api-changelog#may-6-2024
    annotation: int | None
    docstring: '*Optional*. For supergroups, the minimum number of boosts that a non-administrator
      user needs to add in order to ignore slow mode and chat permissions. Returned
      only in :class:`litegram.methods.get_chat.GetChat`.'
